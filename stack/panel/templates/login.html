{% extends "base.html" %}
{% block title %}Anmelden · {{ app_name }}{% endblock %}
{% block body %}
<section class="login">
  <h1>Control Panel</h1>
  <p class="muted">Postfächer für {{ domain }} verwalten.</p>
  <form method="post" action="{{ url_for('login') }}" class="stack">
    <label>E-Mail
      <input type="email" name="email" autocomplete="username" required autofocus>
    </label>
    <label>Passwort
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Anmelden</button>
  </form>
  <p class="muted small">Webmail für Postfächer: <a href="{{ webmail_url }}">{{ webmail_url }}</a></p>
</section>
{% endblock %}
