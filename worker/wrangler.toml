# Sychos Mail — Cloudflare Worker + statische UI
#
# Deploy:   cd worker && npx wrangler deploy
# Lokal:    cd worker && npx wrangler dev
# Vorher:   pnpm --dir ../webmail/web build  und  dist/ fuellen (siehe build.mjs)

name = "sychos-mail"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Domain-Routen: die Webseite laeuft auf Cloudflare, der Tunnel bleibt fuer
# origin.* (API) und admin.* (Control Panel) zustaendig.
# Wichtig: muss VOR den Tabellen stehen, sonst landet es in [vars].
routes = [
  { pattern = "sychos.de/*", zone_name = "sychos.de" },
  { pattern = "www.sychos.de/*", zone_name = "sychos.de" }
]

# Statische Dateien der Svelte-UI (aus webmail/web/build nach dist/ kopiert).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Der Worker muss zuerst laufen, damit /api/* proxied wird statt als Asset zu gelten.
run_worker_first = true

[vars]
APP_NAME = "Sychos Mail"
# Tunnel-Ziel des Mailservers (cloudflared -> 127.0.0.1:8080).
# Kann per Sekret ueberschrieben werden:  npx wrangler secret put API_ORIGIN
API_ORIGIN = "https://origin.sychos.com"

[observability]
enabled = true
